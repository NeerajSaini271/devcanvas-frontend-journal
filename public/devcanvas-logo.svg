<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
  <title id="title">DevCanvas logo</title>
  <desc id="desc">A modern gradient DC monogram with a code symbol and the DevCanvas wordmark.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.52" stop-color="#5B5CEB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B5CEB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g transform="translate(24 24)" filter="url(#softShadow)">
    <rect width="192" height="192" rx="48" fill="url(#brandGradient)"/>
    <path d="M50 49h46c32 0 58 21 58 47s-26 47-58 47H50V49Zm30 27v40h18c15 0 27-9 27-20s-12-20-27-20H80Z" fill="#FFFFFF" fill-rule="evenodd" opacity="0.98"/>
    <path d="M128 62c20 0 37 7 49 20l-21 18c-7-7-16-11-27-11-19 0-34 12-34 28s15 28 34 28c11 0 20-4 27-11l21 18c-12 13-29 20-49 20-36 0-64-24-64-55s28-55 64-55Z" fill="#FFFFFF" opacity="0.33"/>
    <path d="m59 95-16 14 16 14M133 95l16 14-16 14M105 83l-18 52" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(252 58)">
    <text x="0" y="76" fill="#171927" font-family="Space Grotesk, Manrope, Arial, sans-serif" font-size="76" font-weight="750" letter-spacing="-3">Dev</text>
    <text x="145" y="76" fill="url(#wordGradient)" font-family="Space Grotesk, Manrope, Arial, sans-serif" font-size="76" font-weight="750" letter-spacing="-3">Canvas</text>
    <text x="3" y="124" fill="#656A7D" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="6">LEARN. BUILD. EXPLAIN.</text>
  </g>
</svg>
